# --- Redis config ---
# rooms survive a restart: every write goes to an append only file,
# synced to disk once a second
appendonly yes
appendfsync everysec

# the append only file is enough: no snapshots on top of it
save ""

# never drop a room to make space: past the limit, writes are refused and
# the backend logs it. A room takes a few KB, so this holds many thousands.
# Keep the container's mem_limit above it.
maxmemory 256mb
maxmemory-policy noeviction
