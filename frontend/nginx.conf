# --- code-royale frontend: static single page app ---
server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;

  # no version in the Server header or error pages
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # hashed bundles never change: cache them for good
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # every other path is a page of the app, e.g. /game/X7K2P
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
