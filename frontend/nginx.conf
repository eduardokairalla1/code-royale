# --- code-royale frontend: static single page app ---
server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;

  # no version in the Server header or error pages
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # hashed bundles never change: cache them for good
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # rooms are private and short lived: keep them out of search results;
  # the page is the app's, so an invite link still gets its preview
  location /game/ {
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex, nofollow";

    # served from here: try_files would hand it to "/" and lose the header
    rewrite ^ /index.html break;
  }

  # every other path is a page of the app
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
