<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Luckiest+Guy&family=Nunito:wght@400;600;700&family=Patrick+Hand&display=swap"
    />
    <title>Code Royale: a multiplayer coding game to play with friends</title>
    <meta
      name="description"
      content="Create a room, invite your friends and race to solve the same coding challenge. Python, JavaScript, TypeScript, Go, Java, C, C++ and Rust, with autocomplete. Free and open source."
    />
    <link rel="canonical" href="https://coderoyale.app/" />
    <meta name="theme-color" content="#fff8e7" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- link previews: Open Graph, read by chats and social networks -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Code Royale" />
    <meta property="og:url" content="https://coderoyale.app/" />
    <meta property="og:title" content="Code Royale" />
    <meta
      property="og:description"
      content="One challenge, one clock, the best coder takes the crown. A multiplayer coding game to play with your friends."
    />
    <meta property="og:image" content="https://coderoyale.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Code Royale: one challenge, one clock, the best coder takes the crown."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- what the site is, for search engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Code Royale",
        "url": "https://coderoyale.app/",
        "description": "A multiplayer coding game: everyone in the room gets the same challenge and the same clock, and the most hidden tests passed wins.",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Any",
        "isAccessibleForFree": true,
        "license": "https://opensource.org/license/mit",
        "codeRepository": "https://github.com/eduardokairalla1/code-royale",
        "author": { "@type": "Person", "name": "Eduardo Kairalla" },
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
