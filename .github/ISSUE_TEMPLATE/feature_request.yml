name: Feature idea
description: Something the game could do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What's missing
      description: What you wanted to do in the game and couldn't.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could work
  - type: checkboxes
    id: help
    attributes:
      label: Helping out
      options:
        - label: I'd like to build it myself
