name: Bug report
description: Something in the game doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      placeholder: |
        1. Create a room
        2. Start a round with two players
        3. ...
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - coderoyale.app
        - My own deploy
        - Running it locally
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Firefox 140 on Ubuntu
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, the room code, the language you played in, logs.
