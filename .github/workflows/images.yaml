# --- Images ---
# Builds every service's image; pushes <service>-<version>-<sha7> if asked.
name: images

on:
  workflow_call:
    inputs:
      push:
        type: boolean
        required: true

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend, lsp]
    steps:
      - uses: actions/checkout@v5

      # "<version>-<commit>", the same for every service of this run
      - id: tag
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "tag=$version-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # only to push: pull requests never see the secrets
      - if: inputs.push
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # NOTE: the frontend is built with no urls: same origin, /api and /lsp
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          platforms: linux/amd64
          push: ${{ inputs.push }}
          tags: edu3983/code-royale:${{ matrix.service }}-${{ steps.tag.outputs.tag }}
          build-args: |
            VERSION=${{ steps.tag.outputs.version }}
            COMMIT=${{ steps.tag.outputs.commit }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
