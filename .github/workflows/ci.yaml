# --- CI ---
# Every pull request: tests, then builds the images without pushing them.
name: ci

on:
  pull_request:

# a newer push to the pull request supersedes the running one
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yaml

  images:
    needs: tests
    uses: ./.github/workflows/images.yaml
    with:
      push: false
